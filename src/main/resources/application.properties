# Streamable HTTP MCP clients run in the browser (e.g. the MCP Inspector); without the CORS
# filter enabled the extension warns on startup and the Inspector cannot connect.
# Deliberately restricted to local origins: the server has no auth in this first iteration
# (see CLAUDE.md, non-goals), so "allow every origin" would be too wide.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/https?://(localhost|127\\.0\\.0\\.1)(:[0-9]+)?/

# Show logs only in dev mode: no interactive status line at the bottom of the console
# ("Tests paused / Press [e] to edit command line args ...").
%dev.quarkus.console.enabled=false

# Root of the source tree that gets indexed, laid out as <project>/doc/** and <project>/<version>/**.
# Only ever used through java.nio.file.Path, so it does not have to be local disk: a plain path is
# resolved on the default filesystem, a URI by the NIO provider of its scheme. s3x is the scheme
# for a self-hosted S3 store and takes the endpoint from the URI itself; plain s3 goes to AWS.
#
# A local path is the default because this file is public and an address is environment specific.
# The real one belongs in .env or, in the cluster, in the ConfigMap - see .env.example, and note
# the warning there about which spelling is safe.
docs.data-dir=data

# Path style is not optional for a self-hosted store. Without it the bucket becomes part of the
# host name (my-bucket.s3.example.com) and the request dies in DNS resolution rather than at the
# endpoint, which looks like an outage instead of a configuration mistake.
docs.data-dir-properties."s3.spi.force-path-style"=true

# The provider defaults to https, which is right for the store behind its ingress and wrong inside
# the cluster, where the same MinIO answers plain http on its Service - TLS terminates at the
# ingress and never reaches the pod.
#
# Indirect through a properly named property rather than set here, because the value differs per
# environment: the quoted key on the left has no sensible environment variable spelling, while
# docs.s3.endpoint-protocol maps to DOCS_S3_ENDPOINT_PROTOCOL and can therefore come from a
# ConfigMap.
docs.data-dir-properties."s3.spi.endpoint-protocol"=${docs.s3.endpoint-protocol:https}

# Credentials are REFERENCED here, never written here. The three names on the right are resolved
# from whatever configuration source supplies them, and the two that matter are:
#
#   * a .env file in the working directory, which Quarkus reads by itself - this is what makes
#     "run" in an IDE work with no environment set up by hand (see .env.example).
#   * real environment variables, which is how a Kubernetes secret arrives.
#
# One mapping covers both, because Quarkus config sees .env and the environment alike. The empty
# defaults keep a build without credentials working: DataStore skips blank values, so the AWS SDK
# falls back to its own credential chain instead of being handed an empty key.
#
# Why the detour at all: the S3 provider does not read Quarkus configuration, it reads system
# properties (aws.accessKeyId / aws.secretAccessKey, verified in the library itself). docs.data-
# dir-properties is exactly the untyped pass-through into system properties, so nothing here
# teaches this application the vocabulary of a particular provider.
docs.data-dir-properties."aws.accessKeyId"=${AWS_ACCESS_KEY_ID:}
docs.data-dir-properties."aws.secretAccessKey"=${AWS_SECRET_ACCESS_KEY:}
docs.data-dir-properties."aws.region"=${AWS_REGION:us-east-1}

# Tests scan a small fixture tree instead of the real data directory. Set here rather than in a
# @TestProfile so that every @QuarkusTest shares one profile: the in-process embedding model loads
# a native library that only one class loader per JVM may load. This also keeps the build free of
# credentials: no test reaches S3 except S3DataStoreTest, which skips without KVASIR_S3_LOCATION.
%test.docs.data-dir=target/test-classes/data-fixture

# Search backend. Switching between OpenSearch and Elasticsearch is a matter of changing the
# version below (drop the "opensearch:" prefix for Elasticsearch); no code change is needed
# because all mapping annotations and queries are backend neutral.
# Same reasoning as docs.data-dir above: a local default here, the real address from .env or the
# ConfigMap. localhost:9200 is what docker/docker-compose.yaml and a hand-started OpenSearch offer.
quarkus.hibernate-search-standalone.elasticsearch.hosts=localhost:9200
quarkus.hibernate-search-standalone.elasticsearch.protocol=http
quarkus.hibernate-search-standalone.elasticsearch.version=opensearch:3.8

# A cluster behind TLS needs the two properties above switched to port 443 and protocol=https.
# Worth knowing: a certificate from a private or development CA is not trusted by the JVM out of
# the box, even when curl accepts it - curl uses the system store, the JVM its own. Importing that
# CA into the JVM trust store is the fix; plain http is the shortcut.

# The cluster is shared, so index and alias names carry a prefix. Tests get a prefix of their own
# and therefore an index of their own - they must never touch, let alone drop, the index the
# application uses.
quarkus.hibernate-search-standalone.elasticsearch.layout.strategy=bean:prefixed-index-layout
# No prefix outside tests. Deliberately left unset rather than assigned an empty value: SmallRye
# reads an empty property as a missing one and then fails to convert it to a String.
%test.docs.index.prefix=test-

# Create the index on startup if it is missing and validate it against the mapping otherwise, so
# that a mismatch (e.g. a changed embedding dimension) surfaces at startup instead of silently
# producing wrong hits.
quarkus.hibernate-search-standalone.schema-management.strategy=create-or-validate

# Tests own their index outright: it is created at startup and dropped again at shutdown, so a
# test run leaves nothing behind in the cluster.
%test.quarkus.hibernate-search-standalone.schema-management.strategy=drop-and-create-and-drop

# Embedding model. multilingual-e5-small is multilingual, so German documentation embeds sensibly
# too. It is not packaged as a LangChain4j module and runs through the generic custom/ONNX option;
# fetch the files once with scripts/download-embedding-model.sh.
# Other options, all of them 384 dimensions as well: minilm | minilm-quantized | bge-small
docs.embedding.model=custom
docs.embedding.onnx-path=models/multilingual-e5-small/model.onnx
docs.embedding.tokenizer-path=models/multilingual-e5-small/tokenizer.json
docs.embedding.dimension=384
docs.embedding.pooling-mode=MEAN

# E5 expects the prefixes "query: " and "passage: ", which are the defaults in EmbeddingConfig.
# They are model specific - for the MiniLM and BGE options they are noise and should be emptied:
#   docs.embedding.query-prefix=
#   docs.embedding.passage-prefix=
# The defaults deliberately live in Java rather than here, because a trailing space in a
# .properties file is invisible and easily eaten by an editor.

# Make a written document visible to the next query without an explicit refresh.
quarkus.hibernate-search-standalone.indexing.plan.synchronization.strategy=read-sync

# Full text side: with few terms the caller is usually precise, so all of them are required; longer
# natural language questions fall back to a share, otherwise one rare word empties the result.
docs.search.exact-match-max-terms=3
docs.search.min-should-match-percent=75

# Fusion of the BM25 and kNN rankings. These values are handed to OpenSearch's search pipeline
# unchanged - nothing in the application reads or combines raw scores. RRF works on ranks, which is
# what makes an unbounded BM25 score and a cosine similarity comparable in the first place.
docs.search.rrf.rank-constant=60
docs.search.rrf.weight-bm25=0.5
docs.search.rrf.weight-vector=0.5

# Source catalog: the projects, the systems content is fetched from, and the sources themselves.
# Only that - the documents stay in the search index, which is their only durable copy.
#
# Address and credentials are REFERENCED here, never written here, for the same reason as the S3
# ones above: a local default keeps this public file harmless, the real values come from .env or
# the ConfigMap.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${KVASIR_DB_URL:jdbc:postgresql://localhost:5432/kvasir}
quarkus.datasource.username=${KVASIR_DB_USER:kvasir}
quarkus.datasource.password=${KVASIR_DB_PASSWORD:}

# Flyway owns the schema, Hibernate only checks that what it expects is there. Never a strategy
# that writes: this catalog is the only record of what is supposed to be indexed, and the index
# itself cannot say where its chunks came from in a form that could be replayed.
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate

# Searching must not depend on this datasource. An unreachable Postgres may stop indexing, the way
# an unreachable object store already does - but a readiness probe failing over it would pull the
# MCP tools out of the Service for a reason that has nothing to do with retrieval.
quarkus.datasource.health.enabled=false

# Tests run without a database. Nothing reads the catalog yet, and starting a container for it
# would make the build depend on Docker, which the parser, scanner and search tests never needed.
# Dev Services never come into play either way, because the URL above is always configured.
# Both lines come out again with the first test that touches the catalog.
%test.quarkus.hibernate-orm.enabled=false
%test.quarkus.flyway.enabled=false
